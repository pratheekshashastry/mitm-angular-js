<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>To-Do List & Task Manager</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #eef2ff;
    min-height: 100vh;
    padding: 40px 15px;
}

.container {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    color: #1e293b;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin-bottom: 25px;
}

.progress {
    width: 100%;
    height: 12px;
    background: #e2e8f0;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 12px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #2563eb;
    transition: 0.3s;
}

.counter {
    text-align: center;
    color: #475569;
    margin-bottom: 25px;
}

.input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
}

input, select {
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    font-size: 14px;
}

#taskInput {
    flex: 1;
    min-width: 0;
}

button {
    border: none;
    padding: 11px 15px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
}

.add-btn {
    background: #2563eb;
    color: white;
}

.add-btn:hover {
    background: #1d4ed8;
}

.filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.filter-btn {
    background: #e2e8f0;
    color: #334155;
}

.filter-btn.active {
    background: #2563eb;
    color: white;
}

.task-list {
    list-style: none;
}

.task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    margin-bottom: 10px;
}

.task-info {
    flex: 1;
    min-width: 0;
}

.task-title {
    color: #1e293b;
    font-size: 15px;
    overflow-wrap: anywhere;
}

.completed .task-title {
    text-decoration: line-through;
    color: #94a3b8;
}

.priority {
    display: inline-block;
    margin-top: 7px;
    padding: 5px 9px;
    border-radius: 5px;
    font-size: 11px;
}

.High {
    background: #fee2e2;
    color: #dc2626;
}

.Medium {
    background: #fef3c7;
    color: #d97706;
}

.Low {
    background: #dcfce7;
    color: #16a34a;
}

.delete-btn {
    background: #fee2e2;
    color: #dc2626;
}

.delete-btn:hover {
    background: #fecaca;
}

.bulk-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.done-btn {
    background: #16a34a;
    color: white;
}

.clear-btn {
    background: #dc2626;
    color: white;
}

.empty {
    text-align: center;
    color: #94a3b8;
    padding: 25px;
}

@media(max-width: 480px) {
    .container {
        padding: 20px 15px;
    }

    .input-row {
        flex-wrap: wrap;
    }

    #taskInput {
        flex-basis: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>My To-Do List</h1>
    <p class="subtitle">Task & Priority Management</p>

    <!-- Progress Bar -->
    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <p class="counter" id="counter">
        0 of 0 tasks completed
    </p>

    <!-- Add Task Section -->
    <div class="input-row">

        <input
            type="text"
            id="taskInput"
            placeholder="Enter your task..."
        >

        <select id="priority">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
        </select>

        <button type="button" class="add-btn" id="addBtn">
            Add Task
        </button>

    </div>

    <!-- Filter Section -->
    <div class="filters">

        <button type="button" class="filter-btn active" data-filter="all">
            All Tasks
        </button>

        <button type="button" class="filter-btn" data-filter="pending">
            Pending
        </button>

        <button type="button" class="filter-btn" data-filter="completed">
            Completed
        </button>

    </div>

    <!-- Task List -->
    <ul class="task-list" id="taskList"></ul>

    <!-- Bulk Actions -->
    <div class="bulk-actions">

        <button type="button" class="done-btn" id="markAllBtn">
            Mark All as Done
        </button>

        <button type="button" class="clear-btn" id="clearBtn">
            Clear All Completed
        </button>

    </div>

</div>

<script>

// Initial Tasks
let tasks = [
    {
        id: 1,
        title: "Submit AngularJS Assignment",
        priority: "High",
        completed: false
    },
    {
        id: 2,
        title: "Read Supabase Documentation",
        priority: "Medium",
        completed: true
    }
];

let currentFilter = "all";

// Add Task Function
function addTask() {

    const input = document.getElementById("taskInput");
    const priority = document.getElementById("priority");

    const title = input.value.trim();

    if (title === "") {
        alert("Please enter a task!");
        input.focus();
        return;
    }

    const newTask = {
        id: Date.now(),
        title: title,
        priority: priority.value,
        completed: false
    };

    tasks.push(newTask);

    input.value = "";

    currentFilter = "all";

    updateFilterButtons();

    displayTasks();

    input.focus();
}

// Enter Key Function
document.getElementById("taskInput").addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        event.preventDefault();
        addTask();
    }

});

// Update Filter Buttons
function updateFilterButtons() {

    document.querySelectorAll(".filter-btn").forEach(button => {

        button.classList.toggle(
            "active",
            button.dataset.filter === currentFilter
        );

    });

}

// Display Tasks
function displayTasks() {

    const taskList = document.getElementById("taskList");

    taskList.innerHTML = "";

    let filteredTasks = tasks.filter(task => {

        if (currentFilter === "pending") {
            return task.completed === false;
        }

        if (currentFilter === "completed") {
            return task.completed === true;
        }

        return true;

    });

    if (filteredTasks.length === 0) {

        const empty = document.createElement("li");

        empty.className = "empty";
        empty.textContent = "No tasks found!";

        taskList.appendChild(empty);

    }

    filteredTasks.forEach(task => {

        const li = document.createElement("li");

        li.className = "task";

        if (task.completed) {
            li.classList.add("completed");
        }

        // Checkbox
        const checkbox = document.createElement("input");

        checkbox.type = "checkbox";
        checkbox.checked = task.completed;

        checkbox.addEventListener("change", function() {
            toggleTask(task.id);
        });

        // Task Information
        const info = document.createElement("div");

        info.className = "task-info";

        const title = document.createElement("div");

        title.className = "task-title";
        title.textContent = task.title;

        const badge = document.createElement("span");

        badge.className = "priority " + task.priority;
        badge.textContent = task.priority + " Priority";

        info.appendChild(title);
        info.appendChild(badge);

        // Delete Button
        const deleteBtn = document.createElement("button");

        deleteBtn.type = "button";
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "Delete";

        deleteBtn.addEventListener("click", function() {
            deleteTask(task.id);
        });

        li.appendChild(checkbox);
        li.appendChild(info);
        li.appendChild(deleteBtn);

        taskList.appendChild(li);

    });

    updateProgress();

}

// Toggle Task Completion
function toggleTask(id) {

    tasks = tasks.map(task => {

        if (task.id === id) {

            return {
                ...task,
                completed: !task.completed
            };

        }

        return task;

    });

    displayTasks();

}

// Delete Task
function deleteTask(id) {

    tasks = tasks.filter(task => task.id !== id);

    displayTasks();

}

// Filter Tasks
document.querySelectorAll(".filter-btn").forEach(button => {

    button.addEventListener("click", function() {

        currentFilter = this.dataset.filter;

        updateFilterButtons();

        displayTasks();

    });

});

// Mark All Tasks as Completed
function markAllDone() {

    tasks = tasks.map(task => {

        return {
            ...task,
            completed: true
        };

    });

    displayTasks();

}

// Clear All Completed Tasks
function clearCompleted() {

    tasks = tasks.filter(task => !task.completed);

    displayTasks();

}

// Progress Counter
function updateProgress() {

    const total = tasks.length;

    const completed = tasks.filter(
        task => task.completed
    ).length;

    let percentage = total === 0
        ? 0
        : (completed / total) * 100;

    document.getElementById("counter").textContent =
        completed + " of " + total + " tasks completed";

    document.getElementById("progressBar").style.width =
        percentage + "%";

}

// Button Events
document.getElementById("addBtn").addEventListener("click", addTask);

document.getElementById("markAllBtn").addEventListener("click", markAllDone);

document.getElementById("clearBtn").addEventListener("click", clearCompleted);

// Initial Display
displayTasks();

</script>

</body>
</html>
