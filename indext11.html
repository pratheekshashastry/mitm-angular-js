<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic To-Do List & Task Manager</title>
    <!-- Google Fonts & FontAwesome for Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            text-align: center;
            color: #2d3748;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        /* Input Form Layout */
        .input-section {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        select {
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            background: white;
            cursor: pointer;
            font-weight: 500;
        }

        button.add-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0 22px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        button.add-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Progress Bar Section */
        .progress-container {
            margin-bottom: 25px;
            background: #edf2f7;
            border-radius: 10px;
            padding: 15px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            background: #cbd5e0;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #48bb78, #38a169);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 5px;
        }

        /* Task Columns / Lists */
        .lists-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        @media (max-width: 600px) {
            .lists-grid {
                grid-template-columns: 1fr;
            }
        }

        .task-card-column {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            min-height: 200px;
            max-height: 300px;
            overflow-y: auto;
        }

        .task-card-column h3 {
            font-size: 1rem;
            color: #2d3748;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        ul {
            list-style: none;
        }

        .task-item {
            background: white;
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            border-left: 4px solid #cbd5e0;
            transition: all 0.3s;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .task-item.high { border-left-color: #f56565; }
        .task-item.medium { border-left-color: #ed8936; }
        .task-item.low { border-left-color: #48bb78; }

        .task-content {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .task-text {
            font-size: 0.9rem;
            color: #2d3748;
            word-break: break-all;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #a0aec0;
        }

        .priority-badge {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-high { background: #fed7d7; color: #9b2c2c; }
        .badge-medium { background: #feebc8; color: #9c4221; }
        .badge-low { background: #c6f6d5; color: #22543d; }

        .delete-btn {
            background: none;
            border: none;
            color: #e53e3e;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px;
            transition: color 0.2s;
        }

        .delete-btn:hover {
            color: #c53030;
        }

        .empty-text {
            font-size: 0.8rem;
            color: #a0aec0;
            text-align: center;
            margin-top: 30px;
        }

        /* Action Footer Buttons */
        .action-footer {
            display: flex;
            gap: 12px;
        }

        .action-footer button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .mark-all-btn {
            background: #3182ce;
            color: white;
        }

        .clear-all-btn {
            background: #e53e3e;
            color: white;
        }

        .action-footer button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1><i class="fa-solid fa-clipboard-list" style="color: #667eea;"></i> My To-Do List</h1>
        <p class="subtitle">Task & Priority Management</p>

        <!-- Input Section -->
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Enter your next big task...">
            <select id="prioritySelect">
                <option value="High">High</option>
                <option value="Medium" selected>Medium</option>
                <option value="Low">Low</option>
            </select>
            <button class="add-btn" id="addBtn"><i class="fa-solid fa-plus"></i> Add</button>
        </div>

        <!-- Interactive Progress Tracker -->
        <div class="progress-container">
            <div class="progress-info">
                <span id="progressText">0 of 0 tasks completed</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
        </div>

        <!-- Columns for Pending & Completed Tasks -->
        <div class="lists-grid">
            <div class="task-card-column">
                <h3><i class="fa-solid fa-clock-rotate-left" style="color: #ed8936;"></i> Pending Tasks</h3>
                <ul id="pendingList">
                    <!-- Populated via JS -->
                </ul>
            </div>

            <div class="task-card-column">
                <h3><i class="fa-solid fa-circle-check" style="color: #48bb78;"></i> Completed Tasks</h3>
                <ul id="completedList">
                    <!-- Populated via JS -->
                </ul>
            </div>
        </div>

        <!-- Batch Action Buttons -->
        <div class="action-footer">
            <button class="mark-all-btn" id="markAllBtn">Mark All as Done</button>
            <button class="clear-all-btn" id="clearAllBtn">Clear All Completed</button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // State Management stored in localStorage for persistence
        let tasks = JSON.parse(localStorage.getItem('cool_tasks')) || [
            { id: 1, text: 'reading', priority: 'High', completed: true },
            { id: 2, text: 'writing', priority: 'Medium', completed: false }
        ];

        const taskInput = document.getElementById('taskInput');
        const prioritySelect = document.getElementById('prioritySelect');
        const addBtn = document.getElementById('addBtn');
        const pendingList = document.getElementById('pendingList');
        const completedList = document.getElementById('completedList');
        const progressText = document.getElementById('progressText');
        const progressPercent = document.getElementById('progressPercent');
        const progressBarFill = document.getElementById('progressBarFill');
        const markAllBtn = document.getElementById('markAllBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');

        // Render application view
        function renderTasks() {
            pendingList.innerHTML = '';
            completedList.innerHTML = '';

            let pendingCount = 0;
            let completedCount = 0;

            if (tasks.length === 0) {
                pendingList.innerHTML = '<p class="empty-text">No tasks yet! Add one above 🚀</p>';
                completedList.innerHTML = '<p class="empty-text">No completed tasks yet.</p>';
            }

            tasks.forEach(task => {
                const li = document.createElement('li');
                li.className = `task-item ${task.priority.toLowerCase()} ${task.completed ? 'completed' : ''}`;
                
                const badgeClass = `badge-${task.priority.toLowerCase()}`;

                li.innerHTML = `
                    <div class="task-content">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
                        <span class="task-text">${escapeHtml(task.text)}</span>
                        <span class="priority-badge ${badgeClass}">${task.priority}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${task.id})" title="Delete Task"><i class="fa-solid fa-trash"></i></button>
                `;

                if (task.completed) {
                    completedList.appendChild(li);
                    completedCount++;
                } else {
                    pendingList.appendChild(li);
                    pendingCount++;
                }
            });

            // Update Progress bar metrics
            const total = tasks.length;
            const percent = total === 0 ? 0 : Math.round((completedCount / total) * 100);

            progressText.innerText = `${completedCount} of ${total} tasks completed`;
            progressPercent.innerText = `${percent}%`;
            progressBarFill.style.width = `${percent}%`;

            // Save changes locally
            localStorage.setItem('cool_tasks', JSON.stringify(tasks));
        }

        // Add Task Handler
        function addTask() {
            const text = taskInput.value.trim();
            if (!text) {
                alert('Please enter a task description!');
                return;
            }

            const newTask = {
                id: Date.now(),
                text: text,
                priority: prioritySelect.value,
                completed: false
            };

            tasks.push(newTask);
            taskInput.value = '';
            renderTasks();
        }

        // Toggle individual task completion status
        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            renderTasks();
        }

        // Delete individual task
        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderTasks();
        }

        // Mark all tasks as completed
        markAllBtn.addEventListener('click', () => {
            if (tasks.length === 0) return;
            tasks = tasks.map(t => ({ ...t, completed: true }));
            renderTasks();
        });

        // Clear completed tasks bucket
        clearAllBtn.addEventListener('click', () => {
            tasks = tasks.filter(t => !t.completed);
            renderTasks();
        });

        // Event Listeners for adding items
        addBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        // Security Helper to avoid XSS execution via inputs
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initial Load Call
        renderTasks();
    </script>
</body>
</html>
